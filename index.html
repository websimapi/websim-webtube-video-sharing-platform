<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebTube - Video Sharing Platform</title>
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', Arial, sans-serif;
            background: #0f0f0f;
            color: #fff;
        }

        .header {
            background: #212121;
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #303030;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 20px;
            font-weight: bold;
            color: #ff0000;
        }

        .upload-section {
            padding: 24px;
            background: #181818;
            margin: 16px;
            border-radius: 8px;
            border: 2px dashed #303030;
        }

        .upload-area {
            text-align: center;
            padding: 40px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .upload-area:hover {
            background: #252525;
            border-color: #606060;
        }

        .upload-area.dragover {
            background: #252525;
            border-color: #ff0000;
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.7;
        }

        .warning-banner {
            background: linear-gradient(45deg, #ff6b35, #f7931e);
            padding: 12px 24px;
            margin: 16px;
            border-radius: 8px;
            font-weight: 500;
            text-align: center;
        }

        .videos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            padding: 24px;
        }

        .video-card {
            background: #212121;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .video-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }

        .video-thumbnail {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background: #000;
        }

        .video-info {
            padding: 12px;
        }

        .video-title {
            font-weight: 600;
            font-size: 14px;
            line-height: 1.4;
            margin-bottom: 4px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .video-meta {
            color: #aaa;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .user-avatar {
            width: 24px;

        }

        .upload-progress {
            background: #303030;

        .progress-bar {

        }

        .progress-text {
            text-align: center;

            font-size: 12px;
            color: #aaa;
        }

        .modal {
            position: fixed;
            top: 0;

            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex;
            justify-content: center;

        }

        .modal-content {
            background: #212121;
            border-radius: 8px;
            padding: 24px;
            max-width: 90vw;
            max-height: 90vh;
            overflow: auto;
        }

        .video-player {
            width: 100%;
            max-width: 800px;
            border-radius: 8px;
        }

        .close-btn {
            float: right;
            font-size: 24px;
            cursor: pointer;
            color: #aaa;
            margin-bottom: 16px;
        }

        .close-btn:hover {
            color: #fff;
        }

        .local-videos-section {
            margin: 16px;
            padding: 24px;
            background: #181818;
            border-radius: 8px;
        }

        .section-title {
            font-size: 18px;
            margin-bottom: 16px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .resync-btn {
            background: #ff0000;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            margin-left: 8px;
        }

        .resync-btn:hover {
            background: #cc0000;
        }

        .error-message {
            background: #ff4444;
            color: white;
            padding: 12px;
            border-radius: 4px;
            margin-top: 12px;
        }

        input[type="file"] {
            display: none;
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-group label {
            display: block;
            margin-bottom: 4px;
            font-size: 14px;
            color: #aaa;
        }

        .input-group input {
            width: 100%;
            padding: 8px 12px;
            background: #303030;
            border: 1px solid #606060;
            border-radius: 4px;
            color: #fff;
            font-size: 14px;
        }

        .upload-btn {
            background: #ff0000;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            width: 100%;
            margin-top: 16px;
        }

        .upload-btn:hover {
            background: #cc0000;
        }

        .upload-btn:disabled {
            background: #666;
            cursor: not-allowed;
        }

        .tabs {
            display: flex;
            background: #212121;
            border-bottom: 1px solid #303030;
            margin: 0 16px;
            border-radius: 8px 8px 0 0;
            overflow: hidden;
        }

        .tab {
            padding: 16px 24px;
            cursor: pointer;
            background: #181818;
            border: none;
            color: #aaa;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
            flex: 1;
            text-align: center;
        }

        .tab:hover {
            background: #252525;
            color: #fff;
        }

        .tab.active {
            background: #ff0000;
            color: #fff;
        }

        .tab-content {
            min-height: 400px;
        }

        .creator-dashboard {
            padding: 24px;
            background: #181818;
            margin: 0 16px 16px;
            border-radius: 0 0 8px 8px;
        }

        .dashboard-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: #212121;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #303030;
        }

        .stat-number {
            font-size: 24px;
            font-weight: bold;
            color: #ff0000;
            margin-bottom: 4px;
        }

        .stat-label {
            color: #aaa;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .my-videos-list {
            background: #212121;
            border-radius: 8px;
            overflow: hidden;
        }

        .video-item {
            display: flex;
            align-items: center;
            padding: 16px;
            border-bottom: 1px solid #303030;
            transition: background 0.3s ease;
        }

        .video-item:hover {
            background: #252525;
        }

        .video-item:last-child {
            border-bottom: none;
        }

        .video-item-thumbnail {
            width: 120px;
            height: 68px;
            object-fit: cover;
            border-radius: 4px;
            margin-right: 16px;
            background: #000;
        }

        .video-item-info {
            flex: 1;
        }

        .video-item-title {
            font-weight: 600;
            margin-bottom: 4px;
            color: #fff;
        }

        .video-item-meta {
            color: #aaa;
            font-size: 12px;
            margin-bottom: 8px;
        }

        .video-item-description {
            color: #ccc;
            font-size: 13px;
            line-height: 1.4;
        }

        .video-item-actions {
            display: flex;
            gap: 8px;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-edit {
            background: #4CAF50;
            color: white;
        }

        .btn-edit:hover {
            background: #45a049;
        }

        .btn-delete {
            background: #f44336;
            color: white;
        }

        .btn-delete:hover {
            background: #da190b;
        }

        .edit-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1001;
        }

        .edit-modal-content {
            background: #212121;
            border-radius: 8px;
            padding: 24px;
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow: auto;
        }

        .edit-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .edit-form textarea {
            width: 100%;
            padding: 12px;
            background: #303030;
            border: 1px solid #606060;
            border-radius: 4px;
            color: #fff;
            font-size: 14px;
            resize: vertical;
            min-height: 80px;
            font-family: inherit;
        }

        .edit-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 16px;
        }

        .btn-save {
            background: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-save:hover {
            background: #45a049;
        }

        .btn-cancel {
            background: #666;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-cancel:hover {
            background: #555;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #aaa;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Initialize WebsimSocket
        const room = new WebsimSocket();

        function WebTubeApp() {
            const [videos, setVideos] = useState([]);
            const [localVideos, setLocalVideos] = useState([]);
            const [selectedVideo, setSelectedVideo] = useState(null);
            const [uploading, setUploading] = useState(false);
            const [uploadProgress, setUploadProgress] = useState({ progress: 0, status: '' });
            const [error, setError] = useState('');
            const [uploadForm, setUploadForm] = useState({ title: '', description: '' });
            const [activeTab, setActiveTab] = useState('browse');
            const [editingVideo, setEditingVideo] = useState(null);
            const [editForm, setEditForm] = useState({ title: '', description: '' });
            const fileInputRef = useRef();

            // Subscribe to video records
            const videoRecords = React.useSyncExternalStore(
                room.collection('video').subscribe,
                room.collection('video').getList
            );

            useEffect(() => {
                setVideos(videoRecords.reverse()); // Show newest first
                loadLocalVideos();
            }, [videoRecords]);

            const loadLocalVideos = () => {
                const stored = localStorage.getItem('webtube_videos');
                if (stored) {
                    try {
                        const allVideos = JSON.parse(stored);
                        // Filter out videos with blob URLs (broken/temporary URLs)
                        const validVideos = allVideos.filter(video => 
                            video.video_url && 
                            (video.video_url.startsWith('http://') || video.video_url.startsWith('https://'))
                        );
                        
                        // Update localStorage with only valid videos
                        if (validVideos.length !== allVideos.length) {
                            localStorage.setItem('webtube_videos', JSON.stringify(validVideos));
                            console.log(`Cleaned up ${allVideos.length - validVideos.length} broken video URLs from localStorage`);
                        }
                        
                        setLocalVideos(validVideos);
                    } catch (error) {
                        console.error('Error loading local videos:', error);
                        setLocalVideos([]);
                    }
                } else {
                    setLocalVideos([]);
                }
            };

            const saveLocalVideo = (videoData) => {
                // Only save videos with valid HTTP URLs
                if (!videoData.video_url || (!videoData.video_url.startsWith('http://') && !videoData.video_url.startsWith('https://'))) {
                    console.warn('Skipping save of video with invalid URL:', videoData.video_url);
                    return;
                }
                
                const stored = localStorage.getItem('webtube_videos') || '[]';
                const localVids = JSON.parse(stored);
                localVids.push(videoData);
                localStorage.setItem('webtube_videos', JSON.stringify(localVids));
                setLocalVideos(localVids);
            };

            const extractVideoFramesFromUrl = async (videoUrl) => {
                return new Promise((resolve, reject) => {
                    const video = document.createElement('video');
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const frames = [];
                    
                    // Add video to DOM for better browser compatibility
                    video.style.display = 'none';
                    video.crossOrigin = 'anonymous'; // Allow cross-origin video loading
                    document.body.appendChild(video);
                    
                    video.onloadedmetadata = () => {
                        const duration = Math.min(video.duration, 600); // Max 10 minutes
                        const frameInterval = 15; // Every 15 seconds
                        const totalFrames = Math.floor(duration / frameInterval);
                        
                        canvas.width = 320;
                        canvas.height = 180;
                        
                        let frameCount = 0;
                        
                        const captureFrame = () => {
                            if (frameCount >= totalFrames) {
                                document.body.removeChild(video);
                                resolve(frames);
                                return;
                            }
                            
                            const time = frameCount * frameInterval;
                            video.currentTime = time;
                            
                            video.onseeked = () => {
                                try {
                                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                                    const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
                                    frames.push(dataUrl);
                                    frameCount++;
                                    setTimeout(captureFrame, 100); // Small delay for stability
                                } catch (error) {
                                    console.error('Frame capture error:', error);
                                    frameCount++;
                                    setTimeout(captureFrame, 100);
                                }
                            };
                        };
                        
                        if (totalFrames > 0) {
                            captureFrame();
                        } else {
                            document.body.removeChild(video);
                            resolve([]);
                        }
                    };
                    
                    video.onerror = (error) => {
                        document.body.removeChild(video);
                        reject(new Error('Failed to load video for processing'));
                    };
                    
                    video.src = videoUrl;
                    video.load();
                });
            };

            const createDatabaseRecord = async (videoData, maxRetries = 3) => {
                let lastError;
                
                for (let attempt = 0; attempt < maxRetries; attempt++) {
                    try {
                        setUploadProgress({ 
                            progress: 90 + (attempt * 2), 
                            status: attempt > 0 ? `Saving to database (retry ${attempt + 1}/${maxRetries})...` : 'Saving to database...' 
                        });
                        
                        const record = await Promise.race([
                            room.collection('video').create(videoData),
                            new Promise((_, reject) => 
                                setTimeout(() => reject(new Error('Database operation timed out')), 10000)
                            )
                        ]);
                        
                        return record;
                        
                    } catch (error) {
                        lastError = error;
                        console.log(`Database save attempt ${attempt + 1} failed:`, error.message);
                        
                        if (attempt === maxRetries - 1) {
                            break;
                        }
                        
                        const delay = 1000 * Math.pow(2, attempt);
                        await new Promise(resolve => setTimeout(resolve, delay));
                    }
                }
                
                throw lastError;
            };

            const handleFileUpload = async (file) => {
                if (!file) return;
                
                console.log('Starting upload for file:', file.name);
                
                if (!file.type.startsWith('video/')) {
                    setError('Please upload a video file');
                    return;
                }
                
                if (file.size > 100 * 1024 * 1024) { // 100MB limit
                    setError('Video file too large (max 100MB)');
                    return;
                }

                if (!uploadForm.title.trim()) {
                    setError('Please enter a video title');
                    return;
                }

                setUploading(true);
                setError('');
                setUploadProgress({ progress: 10, status: 'Processing video...' });

                try {
                    // Extract frames for moderation
                    console.log('Extracting frames...');
                    const frames = await extractVideoFramesFromUrl(URL.createObjectURL(file));
                    console.log('Extracted frames:', frames.length);
                    
                    let ageRating = 'E'; // Default rating
                    if (frames.length > 0) {
                        ageRating = await moderateContent(frames);
                    }

                    setUploadProgress({ progress: 80, status: 'Uploading video...' });

                    // Upload the video file with retry logic
                    let videoUrl;
                    try {
                        videoUrl = await uploadWithRetry(file, 3); // 3 retry attempts
                        if (!videoUrl || typeof videoUrl !== 'string') {
                            throw new Error('Upload failed - invalid response');
                        }
                        // Ensure we only accept HTTP URLs, not blob URLs
                        if (!videoUrl.startsWith('http://') && !videoUrl.startsWith('https://')) {
                            throw new Error('Upload failed - received invalid URL format');
                        }
                    } catch (uploadError) {
                        console.error('Upload API error:', uploadError);
                        throw new Error('Upload failed after multiple attempts - please try again later');
                    }

                    console.log('Upload successful, URL:', videoUrl);
                    
                    // Get video duration
                    const duration = await getVideoDuration(file);

                    // Create video record
                    const videoData = {
                        title: uploadForm.title.trim(),
                        description: uploadForm.description.trim(),
                        video_url: videoUrl,
                        duration: duration,
                        file_size: file.size,
                        thumbnail_url: frames.length > 0 ? frames[0] : null,
                        age_rating: ageRating
                    };

                    // Save to local storage first (always works)
                    saveLocalVideo(videoData);

                    // Try to save to database with retries
                    try {
                        console.log('Creating database record...');
                        await createDatabaseRecord(videoData);
                        setUploadProgress({ progress: 100, status: 'Upload complete!' });
                    } catch (dbError) {
                        console.warn('Database save failed, but video saved locally:', dbError.message);
                        setUploadProgress({ progress: 100, status: 'Upload complete! (Saved locally - use resync to add to database)' });
                    }
                    
                    // Reset form
                    setUploadForm({ title: '', description: '' });
                    if (fileInputRef.current) {
                        fileInputRef.current.value = '';
                    }
                    
                    setTimeout(() => {
                        setUploading(false);
                        setUploadProgress({ progress: 0, status: '' });
                    }, 3000);

                } catch (error) {
                    console.error('Upload error:', error);
                    setError(error.message || 'Upload failed. Please try again.');
                    setUploading(false);
                    setUploadProgress({ progress: 0, status: '' });
                }
            };

            const uploadWithRetry = async (file, maxRetries = 3, baseDelay = 1000) => {
                let lastError;
                
                for (let attempt = 0; attempt < maxRetries; attempt++) {
                    try {
                        setUploadProgress({ 
                            progress: 80 + (attempt * 5), 
                            status: attempt > 0 ? `Retrying upload (${attempt + 1}/${maxRetries})...` : 'Uploading video...' 
                        });
                        
                        const result = await websim.upload(file);
                        
                        // Validate the result
                        if (!result) {
                            throw new Error('Upload returned null or undefined');
                        }
                        
                        if (typeof result !== 'string') {
                            throw new Error('Upload returned non-string result');
                        }
                        
                        // Check if result is HTML error page instead of URL
                        if (result.trim().startsWith('<') || result.includes('<!DOCTYPE')) {
                            throw new Error('Upload service returned HTML error page instead of URL');
                        }
                        
                        // Validate URL format
                        if (!result.startsWith('http://') && !result.startsWith('https://')) {
                            throw new Error(`Invalid URL format received: ${result.substring(0, 50)}`);
                        }
                        
                        return result;
                        
                    } catch (error) {
                        lastError = error;
                        console.log(`Upload attempt ${attempt + 1} failed:`, error.message);
                        
                        // Don't retry on the last attempt
                        if (attempt === maxRetries - 1) {
                            break;
                        }
                        
                        // Calculate delay with exponential backoff, longer delay for HTML errors
                        const delay = baseDelay * Math.pow(2, attempt) * (error.message.includes('HTML') ? 2 : 1);
                        console.log(`Waiting ${delay}ms before retry...`);
                        
                        await new Promise(resolve => setTimeout(resolve, delay));
                    }
                }
                
                // All retries failed, throw the last error
                throw new Error(`Upload failed after ${maxRetries} attempts. Last error: ${lastError.message}`);
            };

            const getVideoDuration = (file) => {
                return new Promise((resolve, reject) => {
                    const video = document.createElement('video');
                    video.style.display = 'none';
                    document.body.appendChild(video);
                    
                    video.onloadedmetadata = () => {
                        const duration = Math.round(video.duration);
                        document.body.removeChild(video);
                        URL.revokeObjectURL(video.src);
                        resolve(duration);
                    };
                    
                    video.onerror = () => {
                        document.body.removeChild(video);
                        URL.revokeObjectURL(video.src);
                        resolve(0); // Default to 0 if can't get duration
                    };
                    
                    video.src = URL.createObjectURL(file);
                });
            };

            const moderateContent = async (frames) => {
                setUploadProgress({ progress: 30, status: 'Analyzing content for safety...' });
                
                let overallRating = 'E'; // Start with Everyone rating
                const ratingHierarchy = ['E', 'E10+', 'T', 'M', '18+'];
                
                for (let i = 0; i < frames.length; i++) {
                    try {
                        const completion = await websim.chat.completions.create({
                            messages: [{
                                role: "user",
                                content: [
                                    {
                                        type: "text",
                                        text: `Analyze this video frame and provide a detailed description of what you see, then assign an age rating.

Age Rating Scale:
- E (Everyone): Suitable for all ages, no objectionable content
- E10+ (Everyone 10+): Mild cartoon violence or minimal suggestive themes
- T (Teen): Moderate violence, suggestive themes, mild language
- M (Mature 17+): Intense violence, sexual themes, strong language
- 18+ (Adults Only): Graphic violence, explicit sexual content, or other adult material

Respond with JSON only: {
  "description": "detailed description of what you see in the frame",
  "age_rating": "E|E10+|T|M|18+",
  "reasoning": "explanation for the age rating assigned"
}`
                                    },
                                    {
                                        type: "image_url",
                                        image_url: { url: frames[i] }
                                    }
                                ]
                            }],
                            json: true
                        });

                        const result = JSON.parse(completion.content);
                        console.log(`Frame ${i + 1} analysis:`, result);
                        
                        // Check if this frame got an 18+ rating
                        if (result.age_rating === "18+") {
                            throw new Error(`18+ content detected in frame ${i + 1}: ${result.reasoning}`);
                        }
                        
                        // Update overall rating if this frame has a higher rating
                        const currentIndex = ratingHierarchy.indexOf(result.age_rating);
                        const overallIndex = ratingHierarchy.indexOf(overallRating);
                        if (currentIndex > overallIndex) {
                            overallRating = result.age_rating;
                        }
                        
                        setUploadProgress({ 
                            progress: 30 + (i + 1) / frames.length * 40, 
                            status: `Analyzing frame ${i + 1}/${frames.length} (${result.age_rating})...` 
                        });
                    } catch (error) {
                        throw new Error(error.message || 'Content moderation failed');
                    }
                }
                
                console.log(`Video overall age rating: ${overallRating}`);
                return overallRating;
            };

            const handleDrop = (e) => {
                e.preventDefault();
                const file = e.dataTransfer.files[0];
                handleFileUpload(file);
            };

            const handleDragOver = (e) => {
                e.preventDefault();
            };

            const formatDuration = (seconds) => {
                const minutes = Math.floor(seconds / 60);
                const remainingSeconds = seconds % 60;
                return `${minutes}:${remainingSeconds.toString().padStart(2, '0')}`;
            };

            const formatFileSize = (bytes) => {
                if (bytes === 0) return '0 Bytes';
                const k = 1024;
                const sizes = ['Bytes', 'KB', 'MB', 'GB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
            };

            const getUserVideos = () => {
                // Get current user's username (you can implement proper auth later)
                const currentUser = 'guest'; // For now, assume guest user
                return localVideos; // Return all local videos as user's videos
            };

            const getTotalDuration = () => {
                return getUserVideos().reduce((total, video) => total + (video.duration || 0), 0);
            };

            const getTotalFileSize = () => {
                return getUserVideos().reduce((total, video) => total + (video.file_size || 0), 0);
            };

            const openEditModal = (video) => {
                setEditingVideo(video);
                setEditForm({
                    title: video.title,
                    description: video.description || ''
                });
            };

            const closeEditModal = () => {
                setEditingVideo(null);
                setEditForm({ title: '', description: '' });
            };

            const saveVideoEdit = () => {
                if (!editForm.title.trim()) {
                    alert('Title is required');
                    return;
                }

                // Update local storage
                const stored = localStorage.getItem('webtube_videos') || '[]';
                const localVids = JSON.parse(stored);
                const updatedVids = localVids.map(video => 
                    video.video_url === editingVideo.video_url 
                        ? { ...video, title: editForm.title.trim(), description: editForm.description.trim() }
                        : video
                );
                localStorage.setItem('webtube_videos', JSON.stringify(updatedVids));
                setLocalVideos(updatedVids);

                // If video is in database, update it there too
                const databaseVideo = videos.find(v => v.video_url === editingVideo.video_url);
                if (databaseVideo) {
                    room.collection('video').update(databaseVideo.id, {
                        title: editForm.title.trim(),
                        description: editForm.description.trim()
                    }).catch(error => {
                        console.warn('Failed to update database record:', error);
                    });
                }

                closeEditModal();
            };

            const deleteVideo = (video) => {
                if (!confirm('Are you sure you want to delete this video?')) {
                    return;
                }

                // Remove from local storage
                const stored = localStorage.getItem('webtube_videos') || '[]';
                const localVids = JSON.parse(stored);
                const updatedVids = localVids.filter(v => v.video_url !== video.video_url);
                localStorage.setItem('webtube_videos', JSON.stringify(updatedVids));
                setLocalVideos(updatedVids);

                // If video is in database, try to remove it (might fail due to permissions)
                const databaseVideo = videos.find(v => v.video_url === video.video_url);
                if (databaseVideo) {
                    room.collection('video').delete(databaseVideo.id).catch(error => {
                        console.warn('Failed to delete from database (this is normal):', error);
                    });
                }
            };

            const resyncVideo = async (localVideo) => {
                try {
                    console.log('Resyncing video:', localVideo.title);
                    
                    // Re-extract frames and moderate content
                    const frames = await extractVideoFramesFromUrl(localVideo.video_url);
                    console.log('Re-extracted frames for resync:', frames.length);
                    
                    let ageRating = 'E'; // Default rating
                    if (frames.length > 0) {
                        ageRating = await moderateContent(frames);
                        console.log('New age rating for resync:', ageRating);
                    }
                    
                    await createDatabaseRecord({
                        title: localVideo.title,
                        description: localVideo.description,
                        video_url: localVideo.video_url,
                        duration: localVideo.duration,
                        file_size: localVideo.file_size,
                        thumbnail_url: localVideo.thumbnail_url,
                        age_rating: ageRating // Use the newly calculated age rating
                    });
                    
                    console.log('Video resynced successfully with new age rating:', ageRating);
                } catch (error) {
                    console.error('Resync failed:', error);
                    alert('Resync failed: ' + error.message);
                }
            };

            const getLocalVideosNotInDatabase = () => {
                const databaseUrls = new Set(videos.map(v => v.video_url));
                return localVideos.filter(lv => !databaseUrls.has(lv.video_url));
            };

            const renderBrowseTab = () => (
                <div className="tab-content">
                    <div className="warning-banner">
                        ⚠️ Videos are temporarily stored in our database due to entry limits. 
                        Your videos are also saved locally and can be re-synced if removed from the database.
                    </div>

                    <div className="upload-section">
                        <div className="input-group">
                            <label htmlFor="title">Video Title *</label>
                            <input
                                type="text"
                                id="title"
                                value={uploadForm.title}
                                onChange={(e) => setUploadForm({...uploadForm, title: e.target.value})}
                                placeholder="Enter video title..."
                                disabled={uploading}
                            />
                        </div>

                        <div className="input-group">
                            <label htmlFor="description">Description</label>
                            <input
                                type="text"
                                id="description"
                                value={uploadForm.description}
                                onChange={(e) => setUploadForm({...uploadForm, description: e.target.value})}
                                placeholder="Enter video description..."
                                disabled={uploading}
                            />
                        </div>

                        <div 
                            className="upload-area"
                            onDrop={handleDrop}
                            onDragOver={handleDragOver}
                            onClick={() => !uploading && fileInputRef.current?.click()}
                        >
                            <div className="upload-icon">📹</div>
                            <h3>Upload Video</h3>
                            <p>Drag and drop a video file here, or click to browse</p>
                            <p style={{fontSize: '12px', color: '#888', marginTop: '8px'}}>
                                Max 10 minutes, 100MB. Content is automatically moderated.
                            </p>
                        </div>

                        <input
                            ref={fileInputRef}
                            type="file"
                            accept="video/*"
                            onChange={(e) => handleFileUpload(e.target.files[0])}
                            disabled={uploading}
                        />

                        {uploading && (
                            <div className="upload-progress">
                                <div className="progress-bar" style={{width: `${uploadProgress.progress}%`}}></div>
                                <div className="progress-text">{uploadProgress.status}</div>
                            </div>
                        )}

                        {error && (
                            <div className="error-message">{error}</div>
                        )}
                    </div>

                    {getLocalVideosNotInDatabase().length > 0 && (
                        <div className="local-videos-section">
                            <div className="section-title">
                                💾 Local Videos (Not in Database)
                                <button 
                                    className="resync-btn"
                                    onClick={() => getLocalVideosNotInDatabase().forEach(resyncVideo)}
                                >
                                    Resync All
                                </button>
                            </div>
                            <div className="videos-grid">
                                {getLocalVideosNotInDatabase().map((video, index) => (
                                    <div key={index} className="video-card" onClick={() => setSelectedVideo(video)}>
                                        {video.thumbnail_url && (
                                            <img 
                                                src={video.thumbnail_url} 
                                                alt={video.title}
                                                className="video-thumbnail"
                                            />
                                        )}
                                        <div className="video-info">
                                            <div className="video-title">{video.title}</div>
                                            <div className="video-meta">
                                                <span>{formatDuration(video.duration)}</span>
                                                <span>•</span>
                                                <span>{formatFileSize(video.file_size)}</span>
                                                {video.age_rating && (
                                                    <>
                                                        <span>•</span>
                                                        <span style={{background: '#333', padding: '2px 6px', borderRadius: '4px', fontSize: '11px'}}>
                                                            {video.age_rating}
                                                        </span>
                                                    </>
                                                )}
                                                <button 
                                                    className="resync-btn"
                                                    onClick={(e) => {
                                                        e.stopPropagation();
                                                        resyncVideo(video);
                                                    }}
                                                >
                                                    Resync
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    <div style={{margin: '16px', padding: '24px'}}>
                        <div className="section-title">
                            🎬 Recent Videos ({videos.length})
                        </div>
                        <div className="videos-grid">
                            {videos.map((video) => (
                                <div key={video.id} className="video-card" onClick={() => setSelectedVideo(video)}>
                                    {video.thumbnail_url && (
                                        <img 
                                            src={video.thumbnail_url} 
                                            alt={video.title}
                                            className="video-thumbnail"
                                        />
                                    )}
                                    <div className="video-info">
                                        <div className="video-title">{video.title}</div>
                                        <div className="video-meta">
                                            <img 
                                                src={`https://images.websim.com/avatar/${video.username}`}
                                                alt={video.username}
                                                className="user-avatar"
                                            />
                                            <span>{video.username}</span>
                                            <span>•</span>
                                            <span>{formatDuration(video.duration)}</span>
                                            <span>•</span>
                                            <span>{formatFileSize(video.file_size)}</span>
                                            {video.age_rating && (
                                                <>
                                                    <span>•</span>
                                                    <span style={{background: '#333', padding: '2px 6px', borderRadius: '4px', fontSize: '11px'}}>
                                                        {video.age_rating}
                                                    </span>
                                                </>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );

            const renderCreatorDashboard = () => {
                const userVideos = getUserVideos();
                const totalDuration = getTotalDuration();
                const totalSize = getTotalFileSize();

                return (
                    <div className="tab-content">
                        <div className="creator-dashboard">
                            <h2 style={{marginBottom: '24px', color: '#fff'}}>📊 Creator Dashboard</h2>
                            
                            <div className="dashboard-stats">
                                <div className="stat-card">
                                    <div className="stat-number">{userVideos.length}</div>
                                    <div className="stat-label">Total Videos</div>
                                </div>
                                <div className="stat-card">
                                    <div className="stat-number">{formatDuration(totalDuration)}</div>
                                    <div className="stat-label">Total Duration</div>
                                </div>
                                <div className="stat-card">
                                    <div className="stat-number">{formatFileSize(totalSize)}</div>
                                    <div className="stat-label">Total Size</div>
                                </div>
                                <div className="stat-card">
                                    <div className="stat-number">{getLocalVideosNotInDatabase().length}</div>
                                    <div className="stat-label">Pending Sync</div>
                                </div>
                            </div>

                            <h3 style={{marginBottom: '16px', color: '#fff'}}>📁 My Videos</h3>
                            
                            {userVideos.length === 0 ? (
                                <div className="empty-state">
                                    <div className="empty-state-icon">📹</div>
                                    <h3>No videos uploaded yet</h3>
                                    <p>Switch to the Browse tab to upload your first video!</p>
                                </div>
                            ) : (
                                <div className="my-videos-list">
                                    {userVideos.map((video, index) => {
                                        const isInDatabase = videos.some(v => v.video_url === video.video_url);
                                        return (
                                            <div key={index} className="video-item">
                                                {video.thumbnail_url && (
                                                    <img 
                                                        src={video.thumbnail_url} 
                                                        alt={video.title}
                                                        className="video-item-thumbnail"
                                                    />
                                                )}
                                                <div className="video-item-info">
                                                    <div className="video-item-title">{video.title}</div>
                                                    <div className="video-item-meta">
                                                        {formatDuration(video.duration)} • {formatFileSize(video.file_size)}
                                                        {video.age_rating && ` • Rated ${video.age_rating}`}
                                                        {!isInDatabase && (
                                                            <span style={{color: '#ff6b35', marginLeft: '8px'}}>
                                                                • Not in database
                                                            </span>
                                                        )}
                                                    </div>
                                                    {video.description && (
                                                        <div className="video-item-description">
                                                            {video.description.length > 100 
                                                                ? video.description.substring(0, 100) + '...' 
                                                                : video.description}
                                                        </div>
                                                    )}
                                                </div>
                                                <div className="video-item-actions">
                                                    <button 
                                                        className="btn-small btn-edit"
                                                        onClick={() => openEditModal(video)}
                                                    >
                                                        ✏️ Edit
                                                    </button>
                                                    {!isInDatabase && (
                                                        <button 
                                                            className="btn-small resync-btn"
                                                            onClick={() => resyncVideo(video)}
                                                        >
                                                            🔄 Sync
                                                        </button>
                                                    )}
                                                    <button 
                                                        className="btn-small btn-delete"
                                                        onClick={() => deleteVideo(video)}
                                                    >
                                                        🗑️ Delete
                                                    </button>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            )}
                        </div>
                    </div>
                );
            };

            return (
                <div className="app">
                    <header className="header">
                        <div className="logo">
                            📺 WebTube
                        </div>
                        <div style={{fontSize: '14px', color: '#aaa'}}>
                            Powered by WebSim
                        </div>
                    </header>

                    <div className="tabs">
                        <button 
                            className={`tab ${activeTab === 'browse' ? 'active' : ''}`}
                            onClick={() => setActiveTab('browse')}
                        >
                            🏠 Browse
                        </button>
                        <button 
                            className={`tab ${activeTab === 'dashboard' ? 'active' : ''}`}
                            onClick={() => setActiveTab('dashboard')}
                        >
                            📊 Creator Dashboard
                        </button>
                    </div>

                    {activeTab === 'browse' && renderBrowseTab()}
                    {activeTab === 'dashboard' && renderCreatorDashboard()}

                    {selectedVideo && (
                        <div className="modal" onClick={() => setSelectedVideo(null)}>
                            <div className="modal-content" onClick={(e) => e.stopPropagation()}>
                                <div className="close-btn" onClick={() => setSelectedVideo(null)}>×</div>
                                <video 
                                    className="video-player" 
                                    controls 
                                    autoPlay
                                    src={selectedVideo.video_url}
                                >
                                    Your browser does not support the video tag.
                                </video>
                                <h3 style={{marginTop: '16px'}}>{selectedVideo.title}</h3>
                                {selectedVideo.description && (
                                    <p style={{color: '#aaa', marginTop: '8px'}}>{selectedVideo.description}</p>
                                )}
                                <div style={{color: '#aaa', fontSize: '12px', marginTop: '8px'}}>
                                    Uploaded by {selectedVideo.username} • {formatDuration(selectedVideo.duration)} • {formatFileSize(selectedVideo.file_size)}
                                    {selectedVideo.age_rating && ` • Rated ${selectedVideo.age_rating}`}
                                </div>
                            </div>
                        </div>
                    )}

                    {editingVideo && (
                        <div className="edit-modal" onClick={closeEditModal}>
                            <div className="edit-modal-content" onClick={(e) => e.stopPropagation()}>
                                <div className="close-btn" onClick={closeEditModal}>×</div>
                                <h3 style={{marginBottom: '16px', color: '#fff'}}>Edit Video</h3>
                                
                                <div className="edit-form">
                                    <div className="input-group">
                                        <label htmlFor="edit-title">Title *</label>
                                        <input
                                            type="text"
                                            id="edit-title"
                                            value={editForm.title}
                                            onChange={(e) => setEditForm({...editForm, title: e.target.value})}
                                            placeholder="Enter video title..."
                                        />
                                    </div>

                                    <div className="input-group">
                                        <label htmlFor="edit-description">Description</label>
                                        <textarea
                                            id="edit-description"
                                            value={editForm.description}
                                            onChange={(e) => setEditForm({...editForm, description: e.target.value})}
                                            placeholder="Enter video description..."
                                        />
                                    </div>
                                </div>

                                <div className="edit-actions">
                                    <button className="btn-cancel" onClick={closeEditModal}>
                                        Cancel
                                    </button>
                                    <button className="btn-save" onClick={saveVideoEdit}>
                                        Save Changes
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<WebTubeApp />, document.getElementById('root'));
    </script>
